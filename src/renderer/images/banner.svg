  <title id="banner-title">eyesunstrung</title>
  <desc id="banner-desc">An unstrung archtop guitar lying on its edge on a wooden table, body on the left, the neck sloping down to the right with the headstock resting on the table, and a pair of dark sunglasses on the table below the neck. The word eyesunstrung is in the upper right.</desc>
